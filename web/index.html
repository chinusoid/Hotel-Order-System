<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система Управления Отелем</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .card p {
            color: #666;
            margin: 8px 0;
            font-size: 15px;
        }

        .card-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .room-occupied {
            border-left-color: #e74c3c;
        }

        .room-available {
            border-left-color: #27ae60;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .refresh-btn {
            text-align: right;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏨 Система Управления Отелем</h1>
        <p>Профессиональная панель администратора</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('dashboard')">📊 Панель</button>
        <button class="tab" onclick="showTab('guests')">👥 Гости</button>
        <button class="tab" onclick="showTab('rooms')">🛏️ Номера</button>
        <button class="tab" onclick="showTab('checkin')">✅ Заселение</button>
        <button class="tab" onclick="showTab('bookings')">📋 Бронирования</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="tab-content active">
        <div class="refresh-btn">
            <button class="btn btn-primary" onclick="refreshDashboard()">🔄 Обновить данные</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalGuests">0</h3>
                <p>Всего гостей</p>
            </div>
            <div class="stat-card">
                <h3 id="totalRooms">0</h3>
                <p>Всего номеров</p>
            </div>
            <div class="stat-card">
                <h3 id="availableRooms">0</h3>
                <p>Свободных</p>
            </div>
            <div class="stat-card">
                <h3 id="occupiedRooms">0</h3>
                <p>Занятых</p>
            </div>
        </div>

        <div class="section">
            <h2>Занятые номера</h2>
            <div id="occupiedRoomsList" class="grid"></div>
        </div>
    </div>

    <!-- Guests -->
    <div id="guests" class="tab-content">
        <div class="section">
            <h2>Регистрация нового гостя</h2>
            <div id="guestAlert"></div>
            <form id="addGuestForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Имя *</label>
                        <input type="text" id="guestFirstName" required>
                    </div>
                    <div class="form-group">
                        <label>Фамилия *</label>
                        <input type="text" id="guestLastName" required>
                    </div>
                    <div class="form-group">
                        <label>Телефон *</label>
                        <input type="text" id="guestPhone" placeholder="+7 777 123 4567" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="guestEmail" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрировать гостя</button>
            </form>
        </div>

        <div class="section">
            <h2>Список гостей</h2>
            <div class="refresh-btn">
                <button class="btn btn-primary" onclick="loadGuests()">🔄 Обновить</button>
            </div>
            <div id="guestsList" class="grid"></div>
        </div>
    </div>

    <!-- Rooms -->
    <div id="rooms" class="tab-content">
        <div class="section">
            <h2>Все номера отеля</h2>
            <div class="refresh-btn">
                <button class="btn btn-primary" onclick="loadRooms()">🔄 Обновить</button>
            </div>
            <div class="filter-bar" style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="filterRooms('all')">Все</button>
                <button class="btn btn-success" onclick="filterRooms('available')">Свободные</button>
                <button class="btn btn-danger" onclick="filterRooms('occupied')">Занятые</button>
            </div>
            <div id="roomsList" class="grid"></div>
        </div>
    </div>

    <!-- Check In -->
    <div id="checkin" class="tab-content">
        <div class="section">
            <h2>Заселение гостя</h2>
            <div id="checkinAlert"></div>
            <form id="checkinForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Выберите гостя *</label>
                        <select id="checkinGuest" required>
                            <option value="">-- Выберите гостя --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Выберите номер *</label>
                        <select id="checkinRoom" onchange="updateRoomInfo()" required>
                            <option value="">-- Выберите свободный номер --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Дата заезда *</label>
                        <input type="date" id="checkinDate" required>
                    </div>
                    <div class="form-group">
                        <label>Дата выезда *</label>
                        <input type="date" id="checkoutDate" onchange="calculateTotal()" required>
                    </div>
                    <div class="form-group">
                        <label>Количество гостей *</label>
                        <input type="number" id="numberOfGuests" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <label>Вместимость номера</label>
                        <input type="text" id="roomCapacity" readonly style="background: #f0f0f0;">
                    </div>
                </div>

                <div class="form-group">
                    <label>Общая стоимость</label>
                    <input type="text" id="totalCost" readonly style="font-size: 1.8em; font-weight: bold; color: #667eea; background: #f0f0f0;">
                </div>

                <button type="submit" class="btn btn-success" style="font-size: 18px; padding: 15px 40px;">
                    ✅ Заселить гостя
                </button>
            </form>
        </div>
    </div>

    <!-- Bookings -->
    <div id="bookings" class="tab-content">
        <div class="section">
            <h2>Активные бронирования</h2>
            <div class="refresh-btn">
                <button class="btn btn-primary" onclick="loadBookings()">🔄 Обновить</button>
            </div>
            <div id="bookingsList" class="grid"></div>
        </div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeCheckoutModal()">&times;</span>
        <h2 style="color: #667eea; margin-bottom: 20px;">Выселение гостя</h2>
        <div id="checkoutInfo"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-danger" onclick="confirmCheckout()">Подтвердить выселение</button>
            <button class="btn" style="background: #95a5a6; color: white;" onclick="closeCheckoutModal()">Отмена</button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api';
    let allRooms = [];
    let allGuests = [];
    let currentCheckoutRoom = null;

    // Установить сегодняшнюю дату по умолчанию
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date().toISOString().split('T')[0];
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];

        const checkinDateInput = document.getElementById('checkinDate');
        const checkoutDateInput = document.getElementById('checkoutDate');

        if (checkinDateInput) checkinDateInput.value = today;
        if (checkoutDateInput) checkoutDateInput.value = tomorrowStr;
    });

    // Tab switching
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');

        if (tabName === 'dashboard') loadDashboard();
        else if (tabName === 'guests') loadGuests();
        else if (tabName === 'rooms') loadRooms();
        else if (tabName === 'checkin') loadCheckInForm();
        else if (tabName === 'bookings') loadBookings();
    }

    // Refresh Dashboard
    async function refreshDashboard() {
        await loadDashboard();
        showAlert('dashboardAlert', '✅ Данные обновлены!', 'success');
    }

    // Load Dashboard
    async function loadDashboard() {
        console.log('=== ЗАГРУЗКА DASHBOARD ===');
        try {
            const [guestsRes, roomsRes] = await Promise.all([
                fetch(`${API_URL}/guests`),
                fetch(`${API_URL}/rooms`)
            ]);

            const guests = await guestsRes.json();
            const rooms = await roomsRes.json();

            console.log('📋 Все номера:', rooms);

            // ИСПРАВЛЕНО: r.isAvailable (С "is")
            const available = rooms.filter(r => r.isAvailable === true).length;
            const occupied = rooms.filter(r => r.isAvailable === false).length;

            console.log('✅ Свободных:', available);
            console.log('❌ Занятых:', occupied);

            document.getElementById('totalGuests').textContent = guests.length;
            document.getElementById('totalRooms').textContent = rooms.length;
            document.getElementById('availableRooms').textContent = available;
            document.getElementById('occupiedRooms').textContent = occupied;

            // ИСПРАВЛЕНО: r.isAvailable === false
            displayOccupiedRooms(rooms.filter(r => r.isAvailable === false), guests);

            console.log('=== DASHBOARD ЗАГРУЖЕН ===');
        } catch (error) {
            console.error('Error loading dashboard:', error);
        }
    }
    function displayOccupiedRooms(rooms, guests) {
        const container = document.getElementById('occupiedRoomsList');
        if (rooms.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">Все номера свободны 🎉</p>';
            return;
        }

        container.innerHTML = rooms.map(room => {
            const guest = guests.find(g => g.id === room.currentGuestId);
            const guestName = guest ? `${guest.firstName} ${guest.lastName}` : 'Неизвестно';

            return `
                    <div class="card room-occupied">
                        <h3>Номер ${room.roomNumber}</h3>
                        <p><strong>Тип:</strong> ${room.roomType}</p>
                        <p><strong>Гость:</strong> ${guestName}</p>
                        <p><strong>Заезд:</strong> ${room.checkInDate || 'Н/Д'}</p>
                        <p><strong>Выезд:</strong> ${room.checkOutDate || 'Н/Д'}</p>
                        <p><strong>Гостей:</strong> ${room.numberOfGuests} / ${room.capacity}</p>
                        <div class="card-actions">
                            <button class="btn btn-danger" onclick="openCheckoutModal(${room.roomNumber})">
                                Выселить
                            </button>
                        </div>
                    </div>
                `;
        }).join('');
    }

    // Add Guest
    document.getElementById('addGuestForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const guest = {
            firstName: document.getElementById('guestFirstName').value,
            lastName: document.getElementById('guestLastName').value,
            phoneNumber: document.getElementById('guestPhone').value,
            email: document.getElementById('guestEmail').value
        };

        try {
            console.log('Sending guest data:', guest);

            const response = await fetch(`${API_URL}/guests`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(guest)
            });

            console.log('Response status:', response.status);
            const result = await response.json();
            console.log('Response data:', result);

            if (response.ok) {
                showAlert('guestAlert', '✅ Гость успешно зарегистрирован!', 'success');
                e.target.reset();
                await loadGuests();
            } else {
                showAlert('guestAlert', '❌ Ошибка: ' + JSON.stringify(result), 'error');
            }
        } catch (error) {
            console.error('Guest registration error:', error);
            showAlert('guestAlert', '❌ Ошибка при регистрации гостя: ' + error.message, 'error');
        }
    });

    // Load Guests
    async function loadGuests() {
        try {
            const response = await fetch(`${API_URL}/guests`);
            allGuests = await response.json();

            const container = document.getElementById('guestsList');
            container.innerHTML = allGuests.map(guest => `
                    <div class="card">
                        <h3>${guest.firstName} ${guest.lastName}</h3>
                        <p>📞 ${guest.phoneNumber}</p>
                        <p>📧 ${guest.email}</p>
                        <p><strong>ID:</strong> ${guest.id}</p>
                    </div>
                `).join('');
        } catch (error) {
            console.error('Error loading guests:', error);
        }
    }

    // Load Rooms
    async function loadRooms() {
        try {
            const response = await fetch(`${API_URL}/rooms`);
            allRooms = await response.json();
            displayRooms(allRooms);
        } catch (error) {
            console.error('Error loading rooms:', error);
        }
    }

    function displayRooms(rooms) {
        const container = document.getElementById('roomsList');
        container.innerHTML = rooms.map(room => {
            // ИСПРАВЛЕНО: room.isAvailable (С "is")
            const statusClass = room.isAvailable ? 'room-available' : 'room-occupied';
            const statusBadge = room.isAvailable ?
                '<span class="badge badge-success">✓ Свободен</span>' :
                `<span class="badge badge-danger">✗ Занят до ${room.checkOutDate || 'Н/Д'}</span>`;

            return `
            <div class="card ${statusClass}">
                <h3>Номер ${room.roomNumber}</h3>
                <p><strong>Тип:</strong> ${room.roomType}</p>
                <p><strong>Цена:</strong> ${room.pricePerNight.toLocaleString()} ₸/ночь</p>
                <p><strong>Вместимость:</strong> ${room.capacity} чел.</p>
                ${!room.isAvailable ? `<p><strong>Гостей:</strong> ${room.numberOfGuests}</p>` : ''}
                ${statusBadge}
            </div>
        `;
        }).join('');
    }
    function filterRooms(filter) {
        // ИСПРАВЛЕНО: r.isAvailable (С "is")
        if (filter === 'all') {
            displayRooms(allRooms);
        } else if (filter === 'available') {
            displayRooms(allRooms.filter(r => r.isAvailable === true));
        } else if (filter === 'occupied') {
            displayRooms(allRooms.filter(r => r.isAvailable === false));
        }
    }
    // Load Check-in Form
    async function loadCheckInForm() {
        try {
            const [guestsRes, roomsRes] = await Promise.all([
                fetch(`${API_URL}/guests`),
                fetch(`${API_URL}/rooms`)
            ]);

            const guests = await guestsRes.json();
            const rooms = await roomsRes.json();

            const guestSelect = document.getElementById('checkinGuest');
            guestSelect.innerHTML = '<option value="">-- Выберите гостя --</option>' +
                guests.map(g => `<option value="${g.id}">${g.firstName} ${g.lastName} (${g.email})</option>`).join('');

            const roomSelect = document.getElementById('checkinRoom');
            const availableRooms = rooms.filter(r => r.isAvailable === true);

            console.log('Количество свободных номеров:', availableRooms.length);

            roomSelect.innerHTML = '<option value="">-- Выберите свободный номер --</option>' +
                availableRooms.map(r =>
                    `<option value="${r.roomNumber}" data-price="${r.pricePerNight}" data-capacity="${r.capacity}">
                    Номер ${r.roomNumber} - ${r.roomType} (${r.pricePerNight}₸, до ${r.capacity} чел.)
                </option>`
                ).join('');
        } catch (error) {
            console.error('Error loading check-in form:', error);
        }
    }

    function updateRoomInfo() {
        const select = document.getElementById('checkinRoom');
        const capacityInput = document.getElementById('roomCapacity');

        if (select.selectedIndex > 0) {
            const capacity = select.options[select.selectedIndex].getAttribute('data-capacity');
            capacityInput.value = capacity + ' человек(а)';
            calculateTotal();
        } else {
            capacityInput.value = '';
            document.getElementById('totalCost').value = '';
        }
    }

    function calculateTotal() {
        const roomSelect = document.getElementById('checkinRoom');
        const checkinDate = document.getElementById('checkinDate').value;
        const checkoutDate = document.getElementById('checkoutDate').value;

        if (roomSelect.selectedIndex > 0 && checkinDate && checkoutDate) {
            const price = parseFloat(roomSelect.options[roomSelect.selectedIndex].getAttribute('data-price'));
            const nights = Math.ceil((new Date(checkoutDate) - new Date(checkinDate)) / (1000 * 60 * 60 * 24));

            if (nights > 0) {
                const total = price * nights;
                document.getElementById('totalCost').value =
                    `${total.toLocaleString()} ₸ (${nights} ${nights === 1 ? 'ночь' : nights < 5 ? 'ночи' : 'ночей'})`;
            } else {
                document.getElementById('totalCost').value = 'Некорректные даты';
            }
        }
    }
    function updateRoomInfo() {
        const select = document.getElementById('checkinRoom');
        const capacityInput = document.getElementById('roomCapacity');

        if (select.selectedIndex > 0) {
            const capacity = select.options[select.selectedIndex].getAttribute('data-capacity');
            capacityInput.value = capacity + ' человек(а)';
            calculateTotal();
        } else {
            capacityInput.value = '';
            document.getElementById('totalCost').value = '';
        }
    }

    function calculateTotal() {
        const roomSelect = document.getElementById('checkinRoom');
        const checkinDate = document.getElementById('checkinDate').value;
        const checkoutDate = document.getElementById('checkoutDate').value;

        if (roomSelect.selectedIndex > 0 && checkinDate && checkoutDate) {
            const price = parseFloat(roomSelect.options[roomSelect.selectedIndex].getAttribute('data-price'));
            const nights = Math.ceil((new Date(checkoutDate) - new Date(checkinDate)) / (1000 * 60 * 60 * 24));

            if (nights > 0) {
                const total = price * nights;
                document.getElementById('totalCost').value =
                    `${total.toLocaleString()} ₸ (${nights} ${nights === 1 ? 'ночь' : nights < 5 ? 'ночи' : 'ночей'})`;
            } else {
                document.getElementById('totalCost').value = 'Некорректные даты';
            }
        }
    }

    // Check-in Form Submit
    // Check-in Form Submit
    document.getElementById('checkinForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const guestId = parseInt(document.getElementById('checkinGuest').value);
        const roomNumber = parseInt(document.getElementById('checkinRoom').value);
        const checkInDate = document.getElementById('checkinDate').value;
        const checkOutDate = document.getElementById('checkoutDate').value;
        const numberOfGuests = parseInt(document.getElementById('numberOfGuests').value);

        console.log('=== ЗАСЕЛЕНИЕ ===');
        console.log('Гость ID:', guestId);
        console.log('Номер:', roomNumber);
        console.log('Даты:', checkInDate, '-', checkOutDate);
        console.log('Гостей:', numberOfGuests);

        try {
            const response = await fetch(`${API_URL}/checkin`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    guestId,
                    roomNumber,
                    checkInDate,
                    checkOutDate,
                    numberOfGuests
                })
            });

            const result = await response.json();
            console.log('Checkin response:', result);

            if (response.ok && result.success) {
                showAlert('checkinAlert', '✅ Гость успешно заселён!', 'success');
                e.target.reset();
                document.getElementById('roomCapacity').value = '';
                document.getElementById('totalCost').value = '';

                console.log('Ждём 300ms перед обновлением...');
                await new Promise(resolve => setTimeout(resolve, 300));

                // ВАЖНО: Обновляем все данные
                console.log('Обновляем форму заселения...');
                await loadCheckInForm();

                console.log('Обновляем dashboard...');
                await loadDashboard();

                console.log('Обновляем список номеров...');
                await loadRooms();

                console.log('=== ЗАСЕЛЕНИЕ ЗАВЕРШЕНО ===');
            } else {
                showAlert('checkinAlert', '❌ Ошибка при заселении', 'error');
            }
        } catch (error) {
            console.error('Checkin error:', error);
            showAlert('checkinAlert', '❌ Ошибка при заселении: ' + error.message, 'error');
        }
    });

    // Load Bookings
    async function loadBookings() {
        try {
            const [bookingsRes, guestsRes] = await Promise.all([
                fetch(`${API_URL}/bookings`),
                fetch(`${API_URL}/guests`)
            ]);

            const bookings = await bookingsRes.json();
            const guests = await guestsRes.json();

            const container = document.getElementById('bookingsList');

            if (bookings.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">Нет активных бронирований</p>';
                return;
            }

            container.innerHTML = bookings.map(booking => {
                const guest = guests.find(g => g.id === booking.guestId);
                const guestName = guest ? `${guest.firstName} ${guest.lastName}` : 'Неизвестно';

                return `
                        <div class="card">
                            <h3>Бронирование #${booking.id}</h3>
                            <p><strong>Гость:</strong> ${guestName}</p>
                            <p><strong>Заезд:</strong> ${booking.checkInDate}</p>
                            <p><strong>Выезд:</strong> ${booking.checkOutDate}</p>
                            <p><strong>Ночей:</strong> ${booking.numberOfNights}</p>
                            <p><strong>Гостей:</strong> ${booking.numberOfGuests}</p>
                            <p><strong>Стоимость:</strong> ${booking.totalPrice.toLocaleString()} ₸</p>
                            <span class="badge badge-success">${booking.status}</span>
                        </div>
                    `;
            }).join('');
        } catch (error) {
            console.error('Error loading bookings:', error);
        }
    }

    // Checkout Modal
    function openCheckoutModal(roomNumber) {
        console.log('=== ОТКРЫТИЕ МОДАЛЬНОГО ОКНА ===');
        console.log('Переданный номер комнаты:', roomNumber);
        console.log('Тип номера:', typeof roomNumber);

        currentCheckoutRoom = roomNumber;
        console.log('currentCheckoutRoom установлен:', currentCheckoutRoom);

        const modal = document.getElementById('checkoutModal');
        const info = document.getElementById('checkoutInfo');

        info.innerHTML = `
        <p style="font-size: 18px; margin-bottom: 15px;">
            Вы уверены что хотите выселить гостя из номера <strong>${roomNumber}</strong>?
        </p>
        <p style="color: #666;">
            Статус номера изменится на "Свободен", бронирование будет завершено.
        </p>
    `;

        modal.style.display = 'block';
        console.log('Модальное окно открыто');
    }

    function closeCheckoutModal() {
        document.getElementById('checkoutModal').style.display = 'none';
        currentCheckoutRoom = null;
    }

    async function confirmCheckout() {
        if (!currentCheckoutRoom) {
            console.error('currentCheckoutRoom is null!');
            return;
        }

        // СОХРАНЯЕМ номер комнаты в локальную переменную
        const roomNumber = currentCheckoutRoom;
        console.log('Выселяем из номера:', roomNumber);

        try {
            const response = await fetch(`${API_URL}/checkout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomNumber: roomNumber })  // используем локальную переменную
            });

            const result = await response.json();
            console.log('Checkout response:', result);

            if (response.ok && result.success) {
                // Закрываем модальное окно
                closeCheckoutModal();

                // Показываем сообщение с номером комнаты
                alert('✅ Гость выселен из номера ' + roomNumber + '! Номер освобождён.');

                // Ждём немного
                await new Promise(resolve => setTimeout(resolve, 300));

                // Обновляем данные
                await loadDashboard();
                await loadRooms();

                console.log('Выселение завершено для номера:', roomNumber);
            } else {
                alert('❌ Ошибка при выселении: ' + (result.error || result.message));
            }
        } catch (error) {
            console.error('Checkout error:', error);
            alert('❌ Ошибка при выселении: ' + error.message);
        }
    }
    function showAlert(elementId, message, type) {
        const alertDiv = document.getElementById(elementId);
        if (alertDiv) {
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 5000);
        }
    }

    // Load dashboard on start
    loadDashboard();
</script>
</body>
</html>
